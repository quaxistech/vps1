syntax = "proto3";

package alttech.v1;

import "common.proto";

// Additive consumer mirror of AltSpotter's validated raw book delta (tag 37).
message BookLevel {
    Decimal price = 1;
    Decimal size = 2;
}
message OrderBookDelta {
    repeated BookLevel bids = 1;
    repeated BookLevel asks = 2;
    int64 first_update_id = 3;
    int64 sequence = 4;
    int64 previous_sequence = 5;
    int64 exchange_time_ms = 6;
    sint64 checksum = 7;
    optional Decimal ofi_base = 8;
    uint64 book_epoch = 9;
    uint64 delta_counter = 10;
    optional Decimal bbo_depth_base = 11;
}

// ---------------------------------------------------------------------------
// Global observation universe input (four-venue intersection).
//
// AltTech decodes these from the AltSpotter `evt.universe.>` subjects to react
// to universe transitions in real time. Field numbers mirror AltSpotter's
// `marketdata.proto` exactly so the package-agnostic wire form is identical;
// the durable snapshot is also read from PostgreSQL `global_observation_universe`.
// AltTech is a consumer here and never produces universe messages.
// ---------------------------------------------------------------------------

message UniverseVenueState {
    Exchange exchange = 1;
    bool listed = 2;             // linear USDT perpetual exists on the venue
    bool active = 3;             // status allows public trading
    string exchange_symbol = 4;  // venue symbol when listed
    string detail = 5;
}

message UniversePairState {
    int64 canonical_pair_id = 1;  // == instrument_id of the canonical pair
    string base_asset = 2;
    string quote_asset = 3;
    bool eligible = 4;            // present and active on all four venues
    string status = 5;            // ELIGIBLE_ALL_VENUES / MISSING_ON_* / ...
    string reason = 6;
    repeated UniverseVenueState venues = 7;
}

message GlobalUniverseSnapshot {
    int64 computed_at_ms = 1;
    repeated UniversePairState pairs = 2;
}

message GlobalUniverseChange {
    UniversePairState pair = 1;
    string previous_status = 2;
}
