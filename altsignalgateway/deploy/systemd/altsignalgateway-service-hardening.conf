# Common sandbox, installed as a drop-in for the AltSignalGateway service.
#
# This is the one alt* service that accepts inbound connections from outside the
# host, so the sandbox is the tightest on the stack: no capabilities at all
# (nothing here needs to bind below 1024), no new privileges, a read-only
# filesystem apart from its own state directory, and no writable access to the
# TLS private key it reads once at startup.

[Service]
UMask=0027
LimitCORE=0
# A core dump of this process would contain the HMAC client keys and the TLS
# session state in plaintext.
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectProc=invisible
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
# Two I/O threads, the ingest loop, the delivery pump and the supervisor. The
# cap is deliberately close to that: a thread explosion here would be a bug.
TasksMax=24
