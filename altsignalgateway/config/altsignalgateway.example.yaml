# AltSignalGateway service configuration.
# Production copy: /etc/altsignalgateway/altsignalgateway.yaml
#                  (root:altsignalgateway, 0640).
#
# ${VARS} are expanded from the environment (/etc/altsignalgateway/common.env
# under systemd); a missing variable is a startup error, never an empty default.
# No secret ever appears in this file: the database DSN and the NATS URL come
# from the environment, and the WebSocket client keys live in their own file.

environment: ${ALTSIGNALGATEWAY_ENVIRONMENT}
log_level: ${ALTSIGNALGATEWAY_LOG_LEVEL}
timezone: UTC
instance_id: ${ALTSIGNALGATEWAY_INSTANCE_ID}
nats_url: ${ALTSIGNALGATEWAY_NATS_URL}
postgres_dsn: ${ALTSIGNALGATEWAY_POSTGRES_DSN}
shutdown_timeout_sec: 25

# --- external contracts -------------------------------------------------------
wiring:
  id: vps1-boundary

  input:
    # The stream belongs to AltSignalQuality: it is validated here, never
    # created or reconfigured. The only thing this service owns on it is its
    # durable — which is exactly what that service's own INTEGRATION.md
    # prescribes for a downstream consumer.
    stream: ALTSIGNALQUALITY_SIGNALS
    subject_filter: signalquality.final.>
    durable: signalgateway-final
    # Applied only when this durable is first created. `new` starts at the
    # current head; `all` ingests the producer's retained stream history.
    deliver: new

  # Both upstream schemas live in the SAME shared AltSpotter database, so the
  # point-in-time context snapshot and the instrument registry are plain local
  # joins with no FDW on the path.
  altstrategy_schema: altstrategy
  altspotter_schema: public
  # AltTech's macro-core block lives in the separate AltTech database and is
  # read through this postgres_fdw schema (scripts/db-bootstrap.sh creates
  # it). Read once per signal at ingest and on extended-context queries; the
  # delivery path never touches it.
  alttech_schema: alttech_ref
  # The venue the trade plan executes on. Used to resolve the executable symbol
  # and the tick/lot constraints from AltSpotter's registry — the upstream wire
  # message carries an internal token, not a symbol any exchange has heard of.
  execution_exchange: bitget

# --- the durable journal ------------------------------------------------------
journal:
  # At least 2: the ingest loop and the delivery pump each hold a connection.
  postgres_pool_size: 3
  # How many rows one delivery read may pull. This is what bounds memory: the
  # backlog lives in PostgreSQL, and a week behind costs the same RAM as being
  # up to date.
  delivery_batch_size: 64
  expiry_sweep_interval_sec: 30
  retention_interval_sec: 21600
  # Journal retention preserves the record of signals delivered across this
  # boundary. See docs/JOURNAL.md for the schema and retention policy.
  #
  # These two are pushed into altsignalgateway.retention_policies at every
  # startup: the table is what the retention pass reads (it also carries the
  # windows of the tables that have no setting), but the configuration is the
  # source of truth for these two, so changing it here actually changes what is
  # kept.
  retain_days: 400
  rejected_retain_days: 90

# --- the NATS ingest loop ------------------------------------------------------
ingest:
  fetch_batch: 32
  fetch_timeout_ms: 2000
  # A freshness bound ON TOP of each signal's own validity window, measured from
  # T0 (proposal.created_at_ms), not from arrival. 0 disables it and leaves
  # valid_until_ms as the only rule.
  #
  # A signal past this age is journalled and marked EXPIRED; it is not offered
  # to clients. Zero disables this additional freshness bound.
  max_signal_age_sec: 0

# --- TLS ----------------------------------------------------------------------
# There is no plaintext mode. All external client traffic uses TLS.
tls:
  certificate_chain_file: /etc/altsignalgateway/tls/server.crt
  private_key_file: /etc/altsignalgateway/tls/server.key
  min_version: "1.3"
  # Optional mutual TLS, ON TOP of the HMAC handshake rather than instead of it.
  # Enable when the consumer presents a client certificate.
  require_client_certificate: false
  client_ca_file: /etc/altsignalgateway/tls/client-ca.crt

# --- authentication ------------------------------------------------------------
auth:
  # Key material lives ONLY here, in its own file, mode 0640
  # root:altsignalgateway. The service refuses to start if it is world-readable.
  credentials_file: /etc/altsignalgateway/clients.yaml
  # How far a client's signed timestamp may be from this server's clock. It
  # bounds how long a captured signature is even syntactically current; the
  # single-use server nonce is what actually prevents replay.
  max_clock_skew_sec: 60
  handshake_timeout_sec: 10
  # Per-peer back-off. Bounds an online guessing attack without ever locking out
  # a legitimate client, because a success clears the counter.
  auth_failure_threshold: 5
  auth_failure_window_sec: 60
  auth_lockout_sec: 300

# --- the WebSocket endpoint ------------------------------------------------------
websocket:
  # Listener address. Network reachability is controlled separately by the
  # deployment's firewall rules (see docs/SECURITY.md).
  listen_address: 0.0.0.0
  listen_port: 9443
  io_threads: 2
  # An unauthenticated connection already occupies a slot, so this bounds the
  # cheapest denial of service as well as the number of consumers.
  max_clients: 8

  # Inbound and reassembled-message bound, enforced before application buffering.
  max_message_bytes: 1048576

  # Per-session outbound bounds. The pump never produces past them, so in normal
  # operation they are never reached; they exist for the case where the socket
  # stops draining and control frames accumulate behind it.
  max_queued_messages: 256
  max_queued_bytes: 16777216

  heartbeat_interval_sec: 15
  heartbeat_timeout_sec: 45
  resume_timeout_sec: 30
  # A client that receives but never acknowledges is disconnected: its cursor
  # would never advance, so the same signals would be redelivered forever.
  ack_timeout_sec: 120
  shutdown_drain_ms: 2000
  accept_backlog: 16

# --- the protocol-2 query path (docs/CONSUMER_GUIDE.md) -----------------------
# Every value is a ceiling a query is REFUSED beyond (ERR_QUERY_LIMIT /
# ERR_INVALID_QUERY), never a value it is silently clamped to: a caller must
# never receive fewer rows than it believes it asked for.
query:
  default_page_size: 50
  max_page_size: 200
  # Per session, sliding one-minute window.
  rate_per_minute: 120
  # The fixed candle windows a CONTEXT_FULL response carries, ending at the
  # last bar that had closed by the signal's T0.
  candles_1m: 60
  candles_5m: 48
  candles_1h: 48
  # Maximum age at T0 for including a macro vector in query context.
  macro_max_age_sec: 900
