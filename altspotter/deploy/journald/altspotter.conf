# Journald drop-in for the altspotter stack.
# Installed as /etc/systemd/journald.conf.d/altspotter.conf.
# Keeps persistent JSON logs bounded so market-data services cannot fill the disk.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=5000
