# systemd-tmpfiles for altspotter runtime directories.
# Installed as /etc/tmpfiles.d/altspotter.conf.
d /var/lib/altspotter            0750 altspotter  altspotter  -
d /var/lib/altspotter/runtime    0750 altspotter  altspotter  -
d /var/lib/altspotter/state      0750 altspotter  altspotter  -
d /var/lib/altspotter/backups    0700 altspotter  altspotter  -
d /var/backups/altspotter        0700 altspotter  altspotter  -
