# NATS Server configuration for the altspotter stack (template).
# Production copy: /etc/nats/nats-server.conf (root:nats, 0640).
# __NATS_APP_PASSWORD__ is replaced during provisioning; the plaintext
# lives only in /etc/altspotter/common.env (root:altspotter, 0640).

server_name: altspotter-nats-1

# Localhost only: never exposed to the network.
listen: 127.0.0.1:4222

# Monitoring endpoint, localhost only.
http: 127.0.0.1:8222

jetstream {
    store_dir: /var/lib/nats/jetstream
    max_memory_store: 256MB
    max_file_store: 8GB
}

authorization {
    user: altspotter_app
    password: "__NATS_APP_PASSWORD__"
}

max_payload: 1MB
max_connections: 128
write_deadline: "10s"

logtime: true
debug: false
trace: false
