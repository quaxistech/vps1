# Configured observation universe: USDT-margined linear perpetuals.
# A base asset is actually observed only while it is listed AND active on
# every enabled venue (the global four-venue intersection rule); anything
# missing on one venue is excluded everywhere automatically. Only bases that
# trade as a plain <BASE>USDT linear perpetual on ALL enabled venues belong
# here (no venue-specific 1000x multiplier contracts, no venue exclusives).
quote_asset: USDT
contract_type: perpetual
assets:
  - { base: BTC,   expected_symbol: BTCUSDT }
  - { base: ETH,   expected_symbol: ETHUSDT }
  - { base: SOL,   expected_symbol: SOLUSDT }
  - { base: XRP,   expected_symbol: XRPUSDT }
  - { base: BNB,   expected_symbol: BNBUSDT }
  - { base: DOGE,  expected_symbol: DOGEUSDT }
