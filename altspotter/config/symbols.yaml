  - { base: TRX,   expected_symbol: TRXUSDT }
  - { base: LINK,  expected_symbol: LINKUSDT }
  - { base: AVAX,  expected_symbol: AVAXUSDT }
  - { base: BCH,   expected_symbol: BCHUSDT }
  - { base: LTC,   expected_symbol: LTCUSDT }
  - { base: DOT,   expected_symbol: DOTUSDT }
  - { base: NEAR,  expected_symbol: NEARUSDT }
