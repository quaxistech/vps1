# Unified configuration for `altspotter run` — four USDT-perpetual futures
# venues (Bitget, Binance USDS-M, Bybit linear, OKX USDT swap) in one process.
# The shared connection block (nats_url, postgres_dsn, instance_id, ...) lives in
# common.yaml and is passed with --common.
#
# Production copy: /etc/altspotter/altspotter.yaml (root:altspotter, 0640).

# ---------------------------------------------------------------------------
# Which venues are active + the global observation universe (four-venue
# intersection). A pair is observed only when present AND active on every
# enabled venue; missing on one => globally excluded (no subscriptions, no
# backfill, no storage anywhere).
# ---------------------------------------------------------------------------
exchanges:
  bitget:        { enabled: true,  market: usdt_perpetual }
  binance_usdm:  { enabled: true,  market: usdt_perpetual }
  bybit:         { enabled: true,  market: linear_usdt_perpetual }
  okx:           { enabled: true,  market: usdt_swap }

universe:
  require_all_exchanges: true
  # Membership is reevaluated with the instrument catalog sync interval.

# ---------------------------------------------------------------------------
# Instrument catalog + universe resolver: syncs all four venues' contract
# lists, maintains canonical pairs and computes eligibility. Bitget REST config
# lives here (the other venues reuse their runtime sections).
# ---------------------------------------------------------------------------
instrument_catalog:
  symbols_file: config/symbols.yaml
  sync_interval_sec: 900
  postgres_pool_size: 2
  bitget:
    rest_base_url: https://api.bitget.com
    product_type: USDT-FUTURES
    connect_timeout_ms: 5000
    request_timeout_ms: 10000
    rate_limit_per_second: 5
    max_retries: 4
    backoff_min_ms: 250
    backoff_max_ms: 8000

# ---------------------------------------------------------------------------
# Bitget live candles/trades (dedicated WebSocket component).
# ---------------------------------------------------------------------------
market_gateway:
  connections: 2
  candle_update_publish: true
  js_publish_queue_capacity: 8192
  postgres_pool_size: 2
  bitget:
    ws_public_url: wss://ws.bitget.com/v2/ws/public
    product_type: USDT-FUTURES
    connect_timeout_ms: 8000
    ws_ping_interval_sec: 25
    ws_pong_timeout_sec: 15
    ws_rotation_interval_sec: 86400
    max_channels_per_connection: 40
    max_outgoing_messages_per_second: 8
    subscribe_batch_size: 10
    stale_stream_timeout_sec: 60
    backoff_min_ms: 500
    backoff_max_ms: 30000

# Bitget order book + raw trades. Book sampling follows the shared `sampling`
# block below (same cadence as every other venue), so the 1s/1m book aggregates
# are built from a comparable number of observations across all four venues.
microstructure_collector:
  instrument_reload_sec: 300
  postgres_pool_size: 2
  bitget:
    ws_public_url: wss://ws.bitget.com/v2/ws/public
    product_type: USDT-FUTURES
    connect_timeout_ms: 8000
    ws_ping_interval_sec: 25
    ws_pong_timeout_sec: 15
    ws_rotation_interval_sec: 86400
    max_channels_per_connection: 60
    max_outgoing_messages_per_second: 8
    subscribe_batch_size: 10
    stale_stream_timeout_sec: 60
    backoff_min_ms: 500
    backoff_max_ms: 30000

# Bitget derivatives context (mark/index/funding/OI/turnover from the ticker
# channel) — candles/trades/books are handled by the components above.
bitget_context_runtime:
  postgres_pool_size: 2
  js_queue_capacity: 8192
  context_publish_interval_ms: 3000
  ticker_publish_interval_ms: 1000
  bbo_publish_interval_ms: 1000
  # Funding settlement depth. Bitget's own boundary is ~90 days (three pages of
  # history-fund-rate, the fourth is empty), so the request is capped by the
  # venue rather than by this number.
  funding_backfill_days: 180
  # Historical mark/index, written into market_derivatives_context_1m with
  # source_mask bits 1|2. MUST NOT exceed retention.derivatives_context_days,
  # or retention deletes what this loads.
  mark_index_backfill_days: 90
  bitget:
    # REST is used for funding SETTLEMENT history (WS carries only the live
    # rate). AltTech derives each venue's funding interval from these
    # settlements; without them Bitget contributes no funding deviation.
    rest_base_url: https://api.bitget.com
    rate_limit_per_second: 5
    ws_public_url: wss://ws.bitget.com/v2/ws/public
    product_type: USDT-FUTURES

# ---------------------------------------------------------------------------
# Binance USDS-M runtime. WS base URLs are split by stream group: /market
# carries aggTrade + kline_1m + markPrice + ticker, depth is delivered only by
# /public — the runtime keeps one connection per group. REST: exchangeInfo/
# klines/depth/fundingRate/openInterest. Channel and endpoint names follow the
# adapter implementation; see docs/BINANCE_USDM.md for the integration summary.
# ---------------------------------------------------------------------------
binance_usdm_runtime:
  rest_base_url: https://fapi.binance.com
  ws_url: wss://fstream.binance.com/market/stream
  ws_public_url: wss://fstream.binance.com/public/stream
  connect_timeout_ms: 8000
  request_timeout_ms: 10000
  rate_limit_per_second: 2
  max_retries: 4
  backoff_min_ms: 300
  backoff_max_ms: 15000
  stale_timeout_sec: 60
  depth_snapshot_limit: 500
  postgres_pool_size: 3
  js_queue_capacity: 16384
  oi_poll_interval_sec: 60
  funding_backfill_days: 180
  # Historical mark/index, written into market_derivatives_context_1m with
  # source_mask bits 1|2. MUST NOT exceed retention.derivatives_context_days
  # below, or retention deletes what this loads — the same contradiction
  # bootstrap_days had with candles_1m_days.
  mark_index_backfill_days: 90
  sampling: { orderbook_core_interval_ms: 5000, orderbook_other_interval_ms: 15000, orderbook_depth: 15 }

# Bybit Linear USDT perpetual runtime (WS v5: publicTrade + kline.1 +
# orderbook.50 + tickers; {"op":"ping"} every 20s; REST 600 req/5s/IP).
bybit_runtime:
  rest_base_url: https://api.bybit.com
  ws_url: wss://stream.bybit.com/v5/public/linear
  connect_timeout_ms: 8000
  request_timeout_ms: 10000
  rate_limit_per_second: 8
  max_retries: 4
  backoff_min_ms: 300
  backoff_max_ms: 15000
  stale_timeout_sec: 60
  book_depth: 50
  postgres_pool_size: 3
  js_queue_capacity: 16384
  oi_poll_interval_sec: 60
  funding_backfill_days: 180
  # Historical mark/index, written into market_derivatives_context_1m with
  # source_mask bits 1|2. MUST NOT exceed retention.derivatives_context_days
  # below, or retention deletes what this loads — the same contradiction
  # bootstrap_days had with candles_1m_days.
  mark_index_backfill_days: 90
  sampling: { orderbook_core_interval_ms: 5000, orderbook_other_interval_ms: 15000, orderbook_depth: 15 }

# OKX USDT swap runtime (public WS: trades/books/tickers/mark-price/
# funding-rate/open-interest; business WS: candle1m; "ping" text every 20s;
# order book = public "books" channel, seqId/prevSeqId sequencing, no VIP channels).
okx_runtime:
  rest_base_url: https://www.okx.com
  ws_public_url: wss://ws.okx.com:8443/ws/v5/public
  ws_business_url: wss://ws.okx.com:8443/ws/v5/business
  connect_timeout_ms: 8000
  request_timeout_ms: 10000
  rate_limit_per_second: 4
  max_retries: 4
  backoff_min_ms: 300
  backoff_max_ms: 15000
  stale_timeout_sec: 60
  postgres_pool_size: 3
  js_queue_capacity: 16384
  oi_poll_interval_sec: 60
  funding_backfill_days: 180
  # Historical mark/index, written into market_derivatives_context_1m with
  # source_mask bits 1|2. MUST NOT exceed retention.derivatives_context_days
  # below, or retention deletes what this loads — the same contradiction
  # bootstrap_days had with candles_1m_days.
  mark_index_backfill_days: 90
  sampling: { orderbook_core_interval_ms: 5000, orderbook_other_interval_ms: 15000, orderbook_depth: 15 }

# ---------------------------------------------------------------------------
# REST bootstrap (<=180d) + reconcile + gap repair for 1m history — all venues.
# ---------------------------------------------------------------------------
market_history:
  # Must not exceed retention.candles_1m_days below: backfilling further than
  # retention keeps means the extra history is dropped on the next pass. 180
  # here against a 14 d horizon meant 166 days of REST calls thrown away.
  bootstrap_days: 280
  reconcile_interval_sec: 300
  reconcile_overlap_minutes: 30
  publish_batch_size: 1000
  postgres_pool_size: 3

# The only writer of candles to PostgreSQL (venue-aware): ALTSPOTTER_BARS consumer.
storage_writer:
  consumer: { stream: ALTSPOTTER_BARS, durable: storage-writer-bars, fetch_batch: 256, fetch_timeout_ms: 1500 }
  batch_size: 2000
  postgres_pool_size: 4
  db_retry_backoff_min_ms: 500
  db_retry_backoff_max_ms: 30000

# Higher timeframes 5m..1d, built locally from stored 1m candles (all venues).
bar_aggregation:
  timeframes: [5m, 15m, 30m, 1h, 4h, 1d]
  cycle_interval_sec: 60
  close_delay_sec: 45
  recent_recheck_windows: 3
  recheck_horizon_min: 35
  # Periodically revisit recent candle windows and ranges made writable by
  # REST history collection.
  catchup_interval_sec: 600
  publish_batch_size: 500
  postgres_pool_size: 2

# Minute-grid gaps / coverage / repair dispatch / per-instrument health (all venues).
data_integrity:
  gap_scan_interval_sec: 600
  coverage_refresh_interval_sec: 300
  max_gap_repair_attempts: 5
  repair_backoff_base_sec: 120
  repair_backoff_max_sec: 7200
  latest_candle_degraded_sec: 300
  latest_candle_failed_sec: 1800
  max_gap_minutes_per_command: 1000
  partition_ensure_interval_sec: 86400
  postgres_pool_size: 2

# Rolls raw trades + sampled books into compact 1s/1m aggregates before
# retention drops the raw partitions.
microstructure_aggregation:
  cycle_interval_sec: 30
  aggregation_lag_sec: 5
  aggregation_overlap_sec: 120
  max_window_minutes: 240
  postgres_pool_size: 2

# ---------------------------------------------------------------------------
# Database-size budget and tiered persistence. The example thresholds are
# adjusted for the retention profile below; choose a limit for the target host.
# Under pressure, raw persistence is reduced before core market data.
# ---------------------------------------------------------------------------
storage:
  # Example database limit for this configuration profile.
  hard_database_limit_bytes: 42949672960   # 40 GiB
  warning_ratio: 0.80
  cleanup_ratio: 0.87
  critical_ratio: 0.93
  monitor_interval_sec: 300

# ---------------------------------------------------------------------------
# Retention horizons and protected minimums. Keep every history/backfill depth
# within the retention of the table it writes to. The config check also compares
# the projected retained footprint with the storage cleanup threshold.
# ---------------------------------------------------------------------------
retention:
  # High-liquidity core group: longer raw retention. Reconciled into
  # retention_core_assets at startup.
  core_assets: [BTC, ETH, SOL, XRP, BNB, DOGE, ADA, TRX, LINK, AVAX, BCH, LTC]

  # Raw data uses hourly partitions; horizons are expressed in hours.
  raw_trades_core_hours: 60
  raw_trades_core_min_hours: 2
  raw_trades_other_hours: 24
  raw_trades_other_min_hours: 2
  orderbook_core_hours: 6
  orderbook_core_min_hours: 2
  orderbook_other_hours: 4
  orderbook_other_min_hours: 2

  # 1s aggregates (daily partitions)
  trade_1s_core_hours: 12
  trade_1s_core_min_hours: 4
  trade_1s_other_hours: 8
  trade_1s_other_min_hours: 4
  book_1s_core_hours: 12
  book_1s_core_min_hours: 4
  book_1s_other_hours: 8
  book_1s_other_min_hours: 4

  # 1m series (monthly partitions)
  candles_1m_days: 280
  candles_1m_min_days: 120
  derivatives_context_days: 90
  derivatives_context_min_days: 45
  bbo_1m_days: 14
  bbo_1m_min_days: 7
  trade_1m_days: 14
  trade_1m_min_days: 7
  book_1m_days: 14
  book_1m_min_days: 7

  # higher timeframes
  candles_agg_days: 400
  candles_agg_min_days: 200

# Age-based retention for low-volume operational tables. A value of 0 keeps a table indefinitely.
ops_retention:
  ingestion_runs_days: 7
  rejected_events_days: 7
  retention_runs_days: 14
  budget_snapshots_days: 14
  table_statistics_days: 14
  universe_events_days: 90
  resolved_gaps_days: 14
  funding_settlements_days: 200   # Set at or above configured funding history depth

retention_manager:
  routine_interval_sec: 3600
  postgres_pool_size: 2

sampling:
  # Shared sampling cadence. The top-level values configure the Bitget
  # collector; each other venue runtime has its own sampling block.
  orderbook_core_interval_ms: 5000
  orderbook_other_interval_ms: 15000
  # `orderbook_depth` is deliberately absent: the Bitget collector subscribes
  # the `books15` channel, so its depth is fixed at 15 by the channel itself.
  # The venue runtimes take `orderbook_depth` from their own block.
