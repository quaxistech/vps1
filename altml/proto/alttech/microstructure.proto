syntax = "proto3";

package alttech.v1;

// Vendored from AltTech's microstructure.proto, field-for-field. The producer's
// field numbers are the contract; they are never renumbered here.

enum MicrostructureVectorStatus {
    MICROSTRUCTURE_STATUS_UNSPECIFIED = 0;
    MICROSTRUCTURE_STATUS_VALID = 1;
    MICROSTRUCTURE_STATUS_WARMING = 2;
    MICROSTRUCTURE_STATUS_NOT_AVAILABLE = 3;
}

// Trade + order-book microstructure for one tumbling window: trade counts and
// sizes, aggressive buy/sell volume, delta and CVD, large-trade intensity,
// short-term price impact, volume acceleration, burst score, book spread,
// imbalance, microprice deviation and per-side depth. None of it is derivable
// from a candle. AltTech publishes it per window (15s, 30s, 1m); only the 1m
// window aligns to the bar grid this service reasons on.
message MicrostructureVector {
    string window_label = 1;   // 1s | 5s | 15s | 30s | 1m
    int64 window_start_ms = 2; // UTC, inclusive
    string feature_set_name = 3;
    int32 feature_set_version = 4;
    string schema_hash = 5;
    string engine_version = 6;
    repeated float values = 7 [packed = true];
    bytes validity_bitmap = 8;
    MicrostructureVectorStatus status = 9;
    int64 computed_at_ms = 10;
}
